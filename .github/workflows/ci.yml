name: CI - Build, Lint & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # This workflow verifies compilation without a Firebase client configuration.
      # Its APK must not be distributed: normal startup requires Firebase.
      - name: Explain build-only APK
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Build verification only
          No installable APK is published by this workflow. The build can succeed
          without google-services.json, but normal app startup requires Firebase
          configuration. Instrumented UI tests initialize their own test configuration
          and do not verify standalone startup of this APK.

          For a device update, build locally with the correct Firebase configuration
          and the same signing key as the installed app. See README.md, Firebase setup.
          EOF

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/
