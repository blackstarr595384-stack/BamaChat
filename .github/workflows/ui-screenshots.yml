name: UI Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/**"
      - ".github/workflows/ui-screenshots.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run screenshot instrumentation test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -skip-adb-auth -no-metrics
          script: |
            set +e
            chmod +x ./gradlew
            ./gradlew app:assembleDebug app:assembleDebugAndroidTest --stacktrace --info
            BUILD_EXIT=$?
            adb shell rm -rf /sdcard/Download/bamachat-screenshots || true
            ./gradlew app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.example.bamachat.AppScreenshotCaptureTest \
              --stacktrace --info
            TEST_EXIT=$?
            mkdir -p artifacts
            adb pull /sdcard/Download/bamachat-screenshots artifacts/screenshots
            adb logcat -d > artifacts/logcat.txt || true
            if [ $BUILD_EXIT -ne 0 ] || [ $TEST_EXIT -ne 0 ]; then
              exit 1
            fi

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/screenshots
          if-no-files-found: warn

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-debug
          path: |
            artifacts/logcat.txt
            app/build/reports/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
